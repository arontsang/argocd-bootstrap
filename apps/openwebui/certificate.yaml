apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openwebui
spec:
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  secretName: openwebui-tls
  dnsNames:
    - "openwebui.arontsang.com"
  issuerRef:
    name: cloudflare-letsencrypt-prod
    kind: ClusterIssuer
