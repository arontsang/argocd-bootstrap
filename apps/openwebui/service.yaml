apiVersion: v1
kind: Service
metadata:
  name: openwebui
  annotations:
    external-dns.kubernetes.io/hostname: "openwebui.arontsang.com"
spec:
  type: LoadBalancer
  selector:
    app: openwebui
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
