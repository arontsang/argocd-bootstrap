apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-db
spec:
  refreshInterval: 168h
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  target:
    name: openwebui-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: openwebui-db
