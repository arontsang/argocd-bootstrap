apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: openwebui
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
               # - proxmox
                - fake
               # - unraid-k8s
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-db
                  key: DATABASE_URL
            - name: DATA_DIR
              value: /app/backend/data
            - name: AZURE_TOKEN_CREDENTIALS
              value: WorkloadIdentityCredential
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
        - name: caddy
          image: caddy:2.10.2-alpine
          ports:
            - name: https
              containerPort: 443
            - name: http
              containerPort: 80
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: tls
              mountPath: /secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
        - name: caddy-config
          configMap:
            name: openwebui-caddy
        - name: tls
          secret:
            secretName: openwebui-tls
