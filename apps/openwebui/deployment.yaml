apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: openwebui
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
               # - proxmox
                - fake
               # - unraid-k8s
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-db
                  key: DATABASE_URL
            - name: DATA_DIR
              value: /app/backend/data
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
        - name: azure-openai-token
          image: curlimages/curl:8.12.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077

              : "${AZURE_TENANT_ID:?Workload Identity tenant ID is required}"
              : "${AZURE_CLIENT_ID:?Workload Identity client ID is required}"
              : "${AZURE_FEDERATED_TOKEN_FILE:?Workload Identity token file is required}"

              token_dir=/var/run/azure-openai
              sleep_pid=
              stop() {
                  if [ -n "$sleep_pid" ]; then
                      kill "$sleep_pid" 2>/dev/null || true
                      wait "$sleep_pid" || true
                  fi
                  rm -f "$token_dir/access-token.tmp" "$token_dir/expires-at.tmp"
                  exit 0
              }
              trap stop TERM INT

              pause() {
                  sleep "$1" &
                  sleep_pid=$!
                  wait "$sleep_pid"
                  sleep_pid=
              }

              while true; do
                  # Read the projected assertion on every exchange so Kubernetes can rotate it.
                  if response=$(curl --silent --show-error --fail \
                      --connect-timeout 10 --max-time 30 \
                      --request POST \
                      --data-urlencode "client_id=$AZURE_CLIENT_ID" \
                      --data-urlencode 'scope=https://cognitiveservices.azure.com/.default' \
                      --data-urlencode 'grant_type=client_credentials' \
                      --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
                      --data-urlencode "client_assertion@$AZURE_FEDERATED_TOKEN_FILE" \
                      "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token"); then
                      # Entra access tokens are JWTs; restrict extraction to their safe alphabet.
                      response=$(printf '%s' "$response" | tr -d '\r\n')
                      token=$(printf '%s' "$response" | sed -nE 's/.*"access_token"[[:space:]]*:[[:space:]]*"([A-Za-z0-9._-]+)".*/\1/p')
                      expires_in=$(printf '%s' "$response" | sed -nE 's/.*"expires_in"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p')
                      if [ -n "$token" ] && [ -n "$expires_in" ] && [ "$expires_in" -gt 60 ]; then
                          # Atomic replacement keeps Caddy from reading a partially written token.
                          printf '%s' "$token" > "$token_dir/access-token.tmp"
                          chmod 0644 "$token_dir/access-token.tmp"
                          mv "$token_dir/access-token.tmp" "$token_dir/access-token"
                          printf '%s\n' "$(($(date +%s) + expires_in))" > "$token_dir/expires-at.tmp"
                          mv "$token_dir/expires-at.tmp" "$token_dir/expires-at"
                          unset response token
                          delay=$((expires_in - 300))
                          if [ "$delay" -lt 30 ]; then delay=30; fi
                          pause "$delay"
                          continue
                      fi
                  fi

                  # Retain the last usable token during transient failures; never log credentials.
                  echo 'Azure token refresh failed; retrying in 30 seconds' >&2
                  pause 30
              done
          volumeMounts:
            - name: azure-openai-token
              mountPath: /var/run/azure-openai
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -s /var/run/azure-openai/access-token && test "$(cat /var/run/azure-openai/expires-at)" -gt "$(date +%s)"'
            periodSeconds: 10
        - name: azure-openai-proxy
          image: caddy:2.10.2-alpine
          command:
            - /bin/sh
            - /etc/azure-openai/run-caddy.sh
          volumeMounts:
            - name: azure-openai-config
              mountPath: /etc/azure-openai
              readOnly: true
            - name: azure-openai-token
              mountPath: /var/run/azure-openai
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -q -O /dev/null http://127.0.0.1:2019/config/
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
        - name: azure-openai-config
          configMap:
            name: azure-openai-sidecars
        - name: azure-openai-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
