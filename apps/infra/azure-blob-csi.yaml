apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-blob-csi
  namespace: argocd
spec:
  project: default
  source:
    chart: blob-csi-driver
    repoURL: 'https://raw.githubusercontent.com/kubernetes-sigs/blob-csi-driver/master/charts'
    targetRevision: v1.27.11
    path: charts/v1.27.11/
    helm:
      releaseName: blob-csi-driver
      values: |
        workloadIdentity:
          clientID: "128cf48a-5f8a-4b37-be09-842295bd0161"
          tenantID: "4d0ec782-1b23-4888-ba2b-a2a62eba6abc"
        

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false 
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - Replace=true  