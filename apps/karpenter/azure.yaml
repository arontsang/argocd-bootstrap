apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-azure-system
  namespace: argocd
spec:
  project: default
  source:
    chart: karpenter
    repoURL: mcr.microsoft.com/aks/karpenter  # note: the oci:// syntax is not included.
    targetRevision: 1.10.2
    helm:
      releaseName: karpenter
      # valuesObject:
      #   settings:
      #     clusterName: pig-family
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: karpenter-system