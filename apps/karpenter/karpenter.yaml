apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-system
  namespace: argocd
spec:
  project: default
  source:
    chart: karpenter
    repoURL: public.ecr.aws/karpenter  # note: the oci:// syntax is not included.
    targetRevision: 1.15.0
    helm:
      releaseName: karpenter
      valuesObject:
        settings:
          clusterName: pig-family
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: karpenter-system